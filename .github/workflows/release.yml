name: Release Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Read version and changelog
        id: metadata
        shell: python
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          def read_version(revision=None):
              target = revision or "HEAD"
              content = subprocess.check_output(
                  ["git", "show", f"{target}:metadata.yaml"],
                  text=True,
                  encoding="utf-8",
              )
              match = re.search(
                  r"^version:\s*['\"]?([^'\"\s]+)",
                  content,
                  re.MULTILINE,
              )
              if not match:
                  raise RuntimeError("Could not find version in metadata.yaml")
              return match.group(1)

          current_version = read_version()
          try:
              previous_version = read_version("HEAD^")
          except subprocess.CalledProcessError:
              previous_version = ""

          changed = current_version != previous_version
          tag_name = f"V{current_version.removeprefix('v')}"
          version_number = current_version.removeprefix("v")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output:
              output.write(f"version={current_version}\n")
              output.write(f"version_number={version_number}\n")
              output.write(f"tag_name={tag_name}\n")
              output.write(f"changed={str(changed).lower()}\n")

          if not changed:
              raise SystemExit(0)

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^##\s+v?{re.escape(version_number)}\s*$",
              re.MULTILINE | re.IGNORECASE,
          )
          match = heading.search(changelog)
          if not match:
              raise RuntimeError(
                  f"Could not find CHANGELOG.md section for version {current_version}"
              )

          section_start = match.end()
          next_heading = re.search(
              r"^##\s+",
              changelog[section_start:],
              re.MULTILINE,
          )
          section_end = (
              section_start + next_heading.start()
              if next_heading
              else len(changelog)
          )
          body = changelog[section_start:section_end].strip()
          if not body:
              raise RuntimeError(
                  f"CHANGELOG.md section for version {current_version} is empty"
              )
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")

      - name: Create release
        if: steps.metadata.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag_name }}
          name: Release V${{ steps.metadata.outputs.version_number }}
          body_path: release-notes.md
          generate_release_notes: false
